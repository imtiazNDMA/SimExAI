[project]
name = "simexai"
version = "0.1.0"
description = "AI-powered Simulation Exercise Chatbot for NDMA Pakistan"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "langchain-openai>=0.2.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.27",
    "pymupdf>=1.27.2.3",
    "python-docx>=1.2.0",
    "pywin32>=311; sys_platform == 'win32'",
    "json-repair>=0.30.0",
    "pinecone>=5.0.0",
    "langchain-text-splitters>=0.3.0",
    "python-dotenv>=1.0.0",
    "kokoro>=0.9.4",
    "soundfile>=0.14.0",
    "numpy>=2.5.0",
    # Kokoro's g2p layer (misaki) needs this spaCy model and will otherwise try
    # to download it mid-request. Vendored so `uv sync` works offline.
    "en-core-web-sm",
]

[tool.uv.sources]
en-core-web-sm = { path = "vendor/en_core_web_sm-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep the default asyncio mode strict; async tests opt in with the marker.
asyncio_mode = "strict"
